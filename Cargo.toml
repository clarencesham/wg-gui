[package]
name = "wg-gui"
version = "1.2.0"
edition = "2021"
description = "GTK GUI for WireGuard (Rust port of wg-gui)"
license = "MIT"

[dependencies]
gtk = "0.18"
glib = "0.18"
libappindicator = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["debug-embed"] }
ureq = "2"
maxminddb = "0.32"
zip = { version = "2", default-features = false, features = ["deflate"] }
signal-hook = "0.3"
libc = "0.2"

[profile.release]
strip = true
